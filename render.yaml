services:
  - type: web
    name: rotasgoias-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Para o primeiro teste, * permite o frontend publicado chamar a API.
      # Depois de publicar o site, troque pelo domínio HTTPS exato do Lovable.
      - key: ROTAS_CORS_ORIGIN
        value: "*"
