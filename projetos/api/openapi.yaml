openapi: 3.0.3
info:
  title: RotasGoias API
  version: 2.0.0
  description: API HTTP do backend C++ do RotasGoias. Dijkstra e DP com bitmask são executados no backend.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local; em produção use a URL HTTPS publicada.
paths:
  /api/health:
    get:
      summary: Verifica se a API está ativa
      responses:
        '200':
          description: API ativa
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: RotasGoias API }
                  version: { type: string, example: 2.0.0 }
  /api/cities:
    get:
      summary: Lista cidades disponíveis
      responses:
        '200':
          description: Lista de cidades
          content:
            application/json:
              schema:
                type: object
                required: [cities]
                properties:
                  cities:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer }
                        name: { type: string }
  /api/cities/inactive:
    get:
      summary: Informa que bloqueios são temporários por requisição
      responses:
        '200':
          description: Lista vazia e mensagem explicativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items: { type: string }
                  message: { type: string }
  /api/route:
    post:
      summary: Calcula a rota de menor distância
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Resultado de rota; found pode ser false se não houver caminho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '400': { description: JSON ou parâmetros inválidos }
        '413': { description: Corpo excede 64 KiB }
        '415': { description: Content-Type deve ser application/json }
        '429': { description: Limite de requisições excedido }
        '500': { description: Erro interno }
  /api/route/stops:
    post:
      summary: Calcula rota que visita todas as paradas na melhor ordem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RouteRequest'
                - type: object
                  required: [stops]
                  properties:
                    stops:
                      type: array
                      maxItems: 10
                      uniqueItems: true
                      items: { type: string }
      responses:
        '200':
          description: Resultado inclui stopOrder com origem, paradas ordenadas e destino
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '400': { description: JSON ou parâmetros inválidos }
        '413': { description: Corpo excede 64 KiB }
        '415': { description: Content-Type deve ser application/json }
        '429': { description: Limite de requisições excedido }
        '500': { description: Erro interno }
components:
  schemas:
    RouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { type: string, example: Goiania }
        destination: { type: string, example: Brasilia }
        blockedCities:
          type: array
          description: Nomes exatos das cidades a evitar nesta requisição. Cidade desconhecida gera HTTP 400.
          items: { type: string }
        cpf:
          type: string
          description: Opcional; procura autonomia em Usuarios.txt. Não é mecanismo de autenticação.
        autonomy:
          type: number
          minimum: 0.1
          maximum: 100
          description: Autonomia informada para a rota. Só é usada quando não há autonomia válida cadastrada para o CPF.
    RouteResponse:
      type: object
      properties:
        found: { type: boolean }
        message: { type: string }
        error: { type: string }
        origin: { type: string }
        destination: { type: string }
        distanceKm: { type: number, nullable: true }
        path:
          type: array
          items: { type: string }
        stopOrder:
          type: array
          items: { type: string }
        tollCost: { type: number, nullable: true }
        fuelPricePerLiter: { type: number, nullable: true }
        autonomyKmPerLiter: { type: number, nullable: true }
        fuelLiters: { type: number, nullable: true }
        fuelCost: { type: number, nullable: true }
        totalCost: { type: number, nullable: true }
